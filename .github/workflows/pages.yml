# Pubblica su GitHub Pages il sito del progetto (cartella site/) e l'edizione Lite (cartella lite/ → /app/).
# Prima volta: Settings → Pages → Source: "GitHub Actions", poi rilancia il workflow da Actions.
# Gratis con un repository pubblico; su un repository privato serve un piano a pagamento.
name: Pubblica FilamentBox Lite
on:
  push:
    branches: [main]
    paths: ['lite/**', 'site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepara il sito (pagina del progetto + app in /app/)
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r lite _site/app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
