<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prismatica wall art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Mondo unico: tavolo da laboratorio chiaro, accento corallo dei pezzi, ciano del telaio.
     Layout: pannello comandi a sinistra, viewer 3D a destra; su telefono viewer sopra e comandi sotto. */
  --paper:#EDF0F1;
  --panel:#F8FAFA;
  --ink:#172126;
  --muted:#5B6A71;
  --line:#D3DADD;
  --accent:#E2484F;
  --accent-ink:#FFFFFF;
  --cyan:#2FA9BA;
  --warn:#B86A00;
  --ok:#1E8A55;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.45 var(--body);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px}
.back{font:600 13px var(--body);color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:4px 9px;background:#fff}
.back:hover{border-color:var(--ink)}
.kofi{font:600 12px var(--body);color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:#fff;white-space:nowrap}
.kofi:hover{border-color:var(--accent);color:var(--accent)}
.brand h1{font:800 20px/1 var(--display);letter-spacing:-.01em;margin:0}
.ver{font:500 11px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.chip{font:500 12px var(--mono);font-variant-numeric:tabular-nums;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.chip b{font-weight:600}
.chip.warn{border-color:#E7C38A;background:#FFF5E5;color:var(--warn)}
.chip.ok{border-color:#9FD3B6;background:#EAF7EF;color:var(--ok)}
main{flex:1;min-height:0;display:grid;grid-template-columns:340px 1fr}
aside{overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:6px 0 0}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:10px;font:700 13px var(--display);letter-spacing:.02em;text-transform:uppercase}
summary::-webkit-details-marker{display:none}
summary .n{font:500 11px var(--mono);color:var(--accent);width:18px}
summary .hint{margin-left:auto;font:400 12px var(--body);text-transform:none;letter-spacing:0;color:var(--muted)}
summary:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,label.card:focus-within{outline:2px solid var(--cyan);outline-offset:2px}
.sec{padding:2px 16px 16px;display:grid;gap:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:4px}
.field>span{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.field>span output{font:500 12px var(--mono);color:var(--ink)}
input[type=number],select{width:100%;font:500 14px var(--mono);padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent)}
.check{display:flex;align-items:center;gap:8px;font-size:13px}
.check input{accent-color:var(--accent);width:16px;height:16px}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:10px;display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;background:#fff;cursor:pointer}
.drop.over{border-color:var(--accent)}
.drop canvas{width:96px;height:64px;border-radius:4px;background:var(--paper);object-fit:cover}
.drop p{margin:0;font-size:12px;color:var(--muted)}
.drop strong{display:block;color:var(--ink);font-size:13px;margin-bottom:2px}
.shapes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
label.card{position:relative;border:1px solid var(--line);border-radius:8px;padding:6px 4px 5px;display:grid;justify-items:center;gap:2px;cursor:pointer;background:#fff;font-size:12px}
label.card input{position:absolute;opacity:0;pointer-events:none}
label.card svg{width:52px;height:30px}
label.card:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pal{display:grid;gap:6px}
.sw{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:#fff}
.sw input[type=color]{width:34px;height:26px;border:none;padding:0;background:none;cursor:pointer}
.sw .nm{font-weight:600;font-size:13px}
.sw .ct{font:500 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.sw .ct.short{color:var(--warn)}
.sw.f{grid-template-columns:34px 1fr;row-gap:4px}
.sw.f .ct{grid-column:2;text-align:left}
.sw select{font:500 12px var(--body);padding:5px 6px;min-width:0}
.sw .dot{width:34px;height:26px;border-radius:5px;border:1px solid var(--line)}
.inv .note.live{color:var(--ok)}
.mixrow{grid-column:1 / -1;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}
.mixrow.rec{border-top-color:#E7C38A}
.mixrow .mixnote{grid-column:1 / -1;margin:0;font-size:12px;color:var(--muted);line-height:1.4}
.mixrow.rec .mixnote,.mixrow.on .mixnote{color:var(--warn)}
.mixsw{display:flex;gap:3px;justify-self:end}.mixsw i{width:22px;height:14px;border-radius:3px;border:1px solid var(--line);display:block}
.switch{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--body);cursor:pointer}
.switch input{appearance:none;width:30px;height:17px;border-radius:9px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:left .15s}
.switch input:checked{background:var(--accent)}.switch input:checked::after{left:15px}
.inv{display:grid;gap:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.invbtns{display:flex;gap:6px;flex-wrap:wrap}
label.btn{display:inline-block;text-align:center}
.btn{font:600 14px var(--body);border-radius:8px;padding:10px 12px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(.95)}
.btn:disabled{opacity:.55;cursor:progress}
.btn.small{padding:6px 10px;font-size:12px}
.note{font-size:12px;color:var(--muted);margin:0}
.export{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 16px;display:grid;gap:8px}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--cyan);transition:width .15s}
#status{font-size:12px;color:var(--muted);min-height:1.2em;margin:0}
.viewer{position:relative;min-height:0;background:#D8DCDE}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.vbar{position:absolute;left:12px;top:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
.vbar>*{pointer-events:auto}
.seg{display:inline-flex;background:rgba(248,250,250,.92);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{font:600 12px var(--body);border:0;background:none;padding:6px 10px;border-radius:6px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.vbar select{width:auto;font-size:12px;padding:6px 8px;background:rgba(255,255,255,.95)}
.legend{position:absolute;left:12px;bottom:12px;font:500 11px var(--mono);color:var(--ink);background:rgba(248,250,250,.9);border:1px solid var(--line);border-radius:6px;padding:5px 8px;max-width:calc(100% - 24px)}
.busy{position:absolute;right:12px;bottom:12px;font:500 11px var(--mono);color:var(--muted)}
@media (max-width:820px){
  main{grid-template-columns:1fr;grid-template-rows:52vh auto;overflow:auto}
  .viewer{order:-1;min-height:52vh}
  aside{border-right:0;overflow:visible;padding-bottom:0}
  .stats{margin-left:0}
}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
</head>
<body>
<header>
  <a id="fbBack" class="back" href="../index.html" hidden>← FilamentBox</a><div class="brand"><h1>Prismatica</h1><span class="ver">v1.7</span></div>
  <div class="stats" id="stats"></div>
  <a class="kofi" href="https://ko-fi.com/filippocobelli" target="_blank" rel="noopener" title="Prismatica è gratuita: se ti è utile, offrimi un caffè">☕ Ko-fi</a>
</header>
<main>
<aside>
  <details open>
    <summary><span class="n">01</span>Immagine<span class="hint" id="imgHint">esempio</span></summary>
    <div class="sec">
      <label class="drop" id="drop" for="imgFile">
        <canvas id="thumb" width="192" height="128"></canvas>
        <div><strong>Carica un'immagine</strong><p>JPG o PNG, anche trascinata qui. Viene ritagliata alle proporzioni dell'opera.</p></div>
      </label>
      <input type="file" id="imgFile" accept="image/*" hidden>
    </div>
  </details>
  <details open>
    <summary><span class="n">02</span>Dimensioni e pezzi</summary>
    <div class="sec">
      <div class="row">
        <label class="field"><span>Larghezza opera (mm)</span><input type="number" id="W" value="600" min="100" max="4000" step="10"></label>
        <label class="field"><span>Altezza opera (mm)</span><input type="number" id="H" value="300" min="100" max="4000" step="10"></label>
      </div>
      <button class="btn small" id="fitAspect" type="button">Altezza in proporzione all'immagine</button>
      <div class="row">
        <label class="field"><span>Definisci per</span>
          <select id="sizeMode"><option value="count">Numero di pezzi</option><option value="side">Lato triangolo</option></select></label>
        <label class="field" id="countF"><span>Pezzi (circa)</span><input type="number" id="count" value="600" min="20" max="4000" step="10"></label>
        <label class="field" id="sideF" hidden><span>Lato (mm)</span><input type="number" id="side" value="25" min="10" max="120" step="0.5"></label>
      </div>
      <label class="field"><span>Cornice piena <output id="borderO">6 mm</output></span><input type="range" id="border" min="2" max="40" step="1" value="6"></label>
      <p class="note" id="sizeNote"></p>
    </div>
  </details>
  <details open>
    <summary><span class="n">03</span>Colori<span class="hint">un piatto per colore</span></summary>
    <div class="sec">
      <label class="field"><span>Colori da usare</span>
        <select id="palSrc"><option value="inv">Solo i miei filamenti (FilamentBox)</option><option value="img">Liberi, presi dall'immagine</option></select></label>
      <div class="inv" id="invBox">
        <p class="note" id="invStatus">Carico l'inventario…</p>
        <div class="row">
          <label class="field"><span>Materiale</span><select id="matFilter"><option value="">Tutti</option></select></label>
          <label class="field"><span>Minimo residuo (g)</span><input type="number" id="minG" value="50" min="0" max="5000" step="10"></label>
        </div>
        <div class="invbtns"><button class="btn small" id="invReload" type="button">Aggiorna inventario</button><label class="btn small" for="invFile">Carica elenco JSON</label><input type="file" id="invFile" accept=".json,application/json" hidden></div>
      </div>
      <label class="field"><span>Numero di colori <output id="kO">3</output></span><input type="range" id="k" min="2" max="8" step="1" value="3"></label>
      <div class="pal" id="pal"></div>
      <button class="btn small" id="repal" type="button">Ricalcola i colori dall'immagine</button>
    </div>
  </details>
  <details open>
    <summary><span class="n">04</span>Forma del pezzo</summary>
    <div class="sec">
      <div class="shapes" id="shapes"></div>
      <div class="row">
        <label class="field"><span>Altezza min (mm)</span><input type="number" id="hMin" value="8" min="0" max="150" step="1"></label>
        <label class="field"><span>Altezza max (mm)</span><input type="number" id="hMax" value="22" min="0" max="150" step="1"></label>
      </div>
      <label class="field"><span>Altezza guidata da</span>
        <select id="hMode">
          <option value="lum">Luminosità (chiaro = alto)</option>
          <option value="ilum">Luminosità (scuro = alto)</option>
          <option value="center">Distanza dal centro (centro alto)</option>
          <option value="edge">Distanza dal centro (bordo alto)</option>
          <option value="color">Colore (un'altezza per colore)</option>
          <option value="rand">Casuale</option>
          <option value="const">Costante (max)</option>
        </select></label>
      <label class="field"><span>Spostamento della punta <output id="offO">70%</output></span><input type="range" id="offset" min="0" max="95" step="1" value="70"></label>
    </div>
  </details>
  <details open>
    <summary><span class="n">05</span>Orientamento punte</summary>
    <div class="sec">
      <label class="field"><span>Direzione</span>
        <select id="dirMode">
          <option value="vortex">Vortice attorno a un centro</option>
          <option value="contour">Lungo i contorni dell'immagine</option>
          <option value="light">Verso le zone chiare</option>
          <option value="fixed">Angolo fisso</option>
          <option value="rand">Casuale</option>
        </select></label>
      <label class="field" id="twistF"><span>Torsione del vortice <output id="twistO">70°</output></span><input type="range" id="twist" min="-180" max="180" step="5" value="70"></label>
      <div class="row" id="centerF">
        <label class="field"><span>Centro X <output id="cxO">50%</output></span><input type="range" id="cx" min="0" max="100" value="50"></label>
        <label class="field"><span>Centro Y <output id="cyO">50%</output></span><input type="range" id="cy" min="0" max="100" value="50"></label>
      </div>
      <label class="field" id="angleF" hidden><span>Angolo <output id="angleO">90°</output></span><input type="range" id="angle" min="0" max="355" step="5" value="90"></label>
      <label class="field"><span>Variazione casuale <output id="jitO">0°</output></span><input type="range" id="jitter" min="0" max="90" step="1" value="0"></label>
    </div>
  </details>
  <details>
    <summary><span class="n">06</span>Stampa e telaio<span class="hint">piano, tolleranze</span></summary>
    <div class="sec">
      <label class="field"><span>Piano di stampa</span>
        <select id="bed">
          <option value="180x180">180 × 180 (Bambu A1 mini)</option>
          <option value="220x220">220 × 220 (Ender 3, MK3)</option>
          <option value="250x210">250 × 210 (Prusa MK4)</option>
          <option value="256x256" selected>256 × 256 (Bambu X1, P1, A1)</option>
          <option value="300x300">300 × 300</option>
          <option value="350x350">350 × 350 (Voron 350)</option>
        </select></label>
      <div class="row">
        <label class="field"><span>Margine piatto (mm)</span><input type="number" id="margin" value="6" min="0" max="40" step="1"></label>
        <label class="field"><span>Distanza pezzi (mm)</span><input type="number" id="gap" value="3" min="1" max="20" step="0.5"></label>
      </div>
      <div class="row">
        <label class="field"><span>Carta per la dima</span>
          <select id="paper"><option value="A4" selected>A4 (210 × 297)</option><option value="A3">A3 (297 × 420)</option><option value="Letter">Letter (216 × 279)</option></select></label>
        <label class="check" style="align-self:end;padding-bottom:8px"><input type="checkbox" id="inkSave"> Risparmio inchiostro</label>
      </div>
      <label class="check"><input type="checkbox" id="frameOn" checked> Telaio a incastro (griglia con fori)</label>
      <div class="row">
        <label class="field"><span>Spessore telaio (mm)</span><input type="number" id="frameT" value="3" min="1.2" max="10" step="0.2"></label>
        <label class="field"><span>Larghezza costole (mm)</span><input type="number" id="rib" value="1.6" min="0.8" max="5" step="0.1"></label>
      </div>
      <div class="row">
        <label class="field"><span>Gioco incastro (mm)</span><input type="number" id="tol" value="0.15" min="0" max="0.6" step="0.05"></label>
        <label class="field"><span>Spessore base (mm)</span><input type="number" id="flangeT" value="1.2" min="0.6" max="5" step="0.1"></label>
      </div>
      <label class="field"><span>Colore telaio</span><input type="color" id="frameColor" value="#5CC3D0"></label>
      <label class="check"><input type="checkbox" id="engrave" checked> Numero inciso sotto ogni pezzo</label>
      <label class="field"><span>Dettaglio curve <output id="segO">14</output></span><input type="range" id="segs" min="4" max="32" step="1" value="14"></label>
    </div>
  </details>
  <div class="export">
    <button class="btn primary" id="btnZip" type="button">Scarica pacchetto di stampa (.zip)</button>
    <button class="btn" id="btnPdf" type="button">Scarica solo la dima 1:1 (.pdf)</button>
    <div class="prog"><i id="progBar"></i></div>
    <p id="status">Il pacchetto contiene 3MF e STL per ogni piatto, la dima 1:1 e la mappa dei piatti.</p>
  </div>
</aside>
<section class="viewer">
  <canvas id="gl"></canvas>
  <div class="vbar">
    <div class="seg" role="group" aria-label="Vista">
      <button type="button" id="vArt" aria-pressed="true">Opera</button>
      <button type="button" id="vPlate" aria-pressed="false">Piatti</button>
      <button type="button" id="vMap" aria-pressed="false">Colori 2D</button>
    </div>
    <select id="plateSel" aria-label="Piatto" hidden></select>
  </div>
  <div class="legend" id="legend"></div>
  <div class="busy" id="busy"></div>
</section>
</main>

function hexToRgb(h) { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
function rgbToHex([r, g, b]) { return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join(''); }
function srgbLin(c) { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
function linSrgb(c) { const v = c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055; return v * 255; }

  const R = srgbLin(r), G = srgbLin(g), B = srgbLin(b);
  let x = (R * 0.4124 + G * 0.3576 + B * 0.1805) / 0.95047, y = R * 0.2126 + G * 0.7152 + B * 0.0722, z = (R * 0.0193 + G * 0.1192 + B * 0.9505) / 1.08883;

function labToRgb([L, a, b]) {

    }

    pg.rgb('#172126', true).lw(0.35).rect(tx(0), ty(0), p.W, p.H, 'S');
    // crocini di registro
    pg.rgb('#000000', true).lw(0.25);
    for (const X of crossX) if (X > x0 - 1 && X < x0 + SP.cw + 1) for (const Y of along(Math.min(ytop, p.H) - Math.max(y0, 0), Math.max(y0, 0))) pg.cross(tx(X), ty(Y));
    for (const Y of crossY) if (Y > y0 - 1 && Y < ytop + 1) for (const X of along(Math.min(x0 + SP.cw, p.W) - x0, x0)) pg.cross(tx(X), ty(Y));
    for (const X of crossX) for (const Y of crossY) if (X > x0 - 1 && X < x0 + SP.cw + 1 && Y > y0 - 1 && Y < ytop + 1) pg.cross(tx(X), ty(Y));
    pg.unclip();
    // bordo area utile
    pg.rgb('#9AA5AA', true).lw(0.2).rect(cL, cB, SP.cw, SP.ch, 'S');
    // linee di taglio (sinistra, alto) al centro della fascia
    pg.rgb('#E2484F', true).lw(0.35).dash(2.5, 1.5);
    if (c > 0) { const X = tx(x0 + ov / 2); pg.line([X, 2], [X, SP.ph - 2]); }
    if (r > 0) { const Y = ty(ytop - ov / 2); pg.line([2, Y], [SP.pw - 2, Y]); }
    pg.dash();
    if (c > 0) pg.rgb('#E2484F').textRot(m - 1.5, cB + SP.ch / 2, 7, `TAGLIA - si appoggia su ${sheetName(r, c - 1)}`, { center: true, bold: true });
    if (r > 0) pg.rgb('#E2484F').text(cL + SP.cw / 2, cT + 1.2 - 0, 7, `TAGLIA - si appoggia su ${sheetName(r - 1, c)}`, { center: true, bold: true });
    // fasce dove si appoggia il foglio successivo
    pg.rgb('#55636A', true).lw(0.2).dash(0.6, 1);
    if (c < SP.nx - 1) { const X = cR - ov; pg.line([X, cB], [X, cT]); }
    if (r < SP.ny - 1) { const Y = cB + ov; pg.line([cL, Y], [cR, Y]); }
    pg.dash();
    if (c < SP.nx - 1) pg.rgb('#55636A').textRot(SP.pw - 2.2, cB + SP.ch / 2, 6.5, `${sheetName(r, c + 1)} si sovrappone qui (${ov} mm)`, { center: true });
    if (r < SP.ny - 1) pg.rgb('#55636A').text(cL + 2, m / 2 - 1, 6.5, `${sheetName(r + 1, c)} si sovrappone qui (${ov} mm)`);
    // intestazione + mini mappa
    pg.rgb('#172126').text(m, SP.ph - m + 2.2, 10, `Foglio ${sheetName(r, c)}`, { bold: true });
    pg.rgb('#55636A').text(m + 22, SP.ph - m + 2.2, 7, `riga ${r + 1} di ${SP.ny}, colonna ${c + 1} di ${SP.nx} · scala 1:1, stampa al 100% · Prismatica ${VERSION}`);
    const ms = Math.min(3.2, 30 / SP.nx, 7 / SP.ny), mx = SP.pw - m - SP.nx * ms, my = SP.ph - m + 1.2;
    for (let rr = 0; rr < SP.ny; rr++) for (let cc = 0; cc < SP.nx; cc++) { const X = mx + cc * ms, Y = my + (SP.ny - 1 - rr) * ms; if (rr === r && cc === c) pg.rgb('#172126').rect(X, Y, ms - 0.4, ms - 0.4, 'f'); else pg.rgb('#9AA5AA', true).lw(0.15).rect(X, Y, ms - 0.4, ms - 0.4, 'S'); }
    // barre di controllo 50 mm (orizzontale e verticale)
    pg.rgb('#172126', true).lw(0.4);
    const bx = SP.pw - m - 50, by = m / 2 + 0.5;
    pg.line([bx, by], [bx + 50, by]).line([bx, by - 1], [bx, by + 1]).line([bx + 50, by - 1], [bx + 50, by + 1]);
    pg.rgb('#172126').text(bx + 18, by + 1.3, 6, '50 mm');
    const vx = SP.pw - m / 2 - 1.5, vy = cB + 4;
    pg.rgb('#172126', true).line([vx, vy], [vx, vy + 50]).line([vx - 1, vy], [vx + 1, vy]).line([vx - 1, vy + 50], [vx + 1, vy + 50]);
    pages.push(pg);
  }
  // mappe piatti
  for (const pl of S.plates) {
    const pg = new Page(297, 210), sc = Math.min((297 - 30) / p.bedW, (210 - 34) / p.bedD), ox = (297 - p.bedW * sc) / 2, oy = 14;
    pg.rgb('#172126').text(15, 196, 14, pl.name.replace(/(\d)di(\d)/, '$1 di $2'), { bold: true });
    pg.rgb('#55636A').text(15, 190, 9, pl.kind === 'pieces' ? `${pl.items.length} pezzi · ${S.palette[pl.color].mixOn && S.palette[pl.color].mix ? 'MIX con AMS: ' + S.palette[pl.color].mix.parts.map(x => x.f.name + ' ' + x.pct + '%').join(' + ') : 'colore ' + S.palette[pl.color].label + ' ' + S.palette[pl.color].hex.toUpperCase()} · piano ${p.bedW} × ${p.bedD} mm` : `Tassello telaio ${pl.tile.label} · piano ${p.bedW} × ${p.bedD} mm`);
    pg.rgb('#172126', true).lw(0.3).rect(ox, oy, p.bedW * sc, p.bedD * sc, 'S');
    if (pl.kind === 'pieces') {
      const sF = p.s - SQ3 * 0.3, R = sF / SQ3;
      const nfs = Math.max(4, Math.min(10, sF * sc * 0.2 * MM));
      for (const it of pl.items) {
        const s0 = it.slot, pts = [0, 1, 2].map(k => { const a = (s0.up ? Math.PI / 2 : -Math.PI / 2) + k * 2 * Math.PI / 3; return [ox + (s0.x + R * Math.cos(a)) * sc, oy + (s0.y + R * Math.sin(a)) * sc]; });
        pg.rgb(tint(dispHex(S.palette[pl.color]), 0.6)).poly(pts, 'f').rgb('#55636A', true).lw(0.15).poly(pts, 'S');
        pg.rgb('#172126').text(ox + s0.x * sc, oy + s0.y * sc - nfs / MM * 0.35, nfs, String(it.cell.id), { center: true });
      }
    } else {
      const loops = unionBoundary(pl.tile.elems.map(e => e.poly)); let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
      for (const l of loops) for (const v of l) { x0 = Math.min(x0, v[0]); x1 = Math.max(x1, v[0]); y0 = Math.min(y0, v[1]); y1 = Math.max(y1, v[1]); }
      const dx = p.bedW / 2 - (x0 + x1) / 2, dy = p.bedD / 2 - (y0 + y1) / 2;
      pg.rgb(tint(p.frameColor, 0.5)); for (const l of loops) pg.poly(l.map(v => [ox + (v[0] + dx) * sc, oy + (v[1] + dy) * sc]), 'f');
      pg.rgb('#172126').text(ox + p.bedW * sc / 2, oy + p.bedD * sc / 2, 18, pl.tile.label, { center: true, bold: true });
    }
    pages.push(pg);
  }
  return makePDF(pages);
}

let DL = null;
function initDL() { try { if (window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then(d => { if (d) DL = d; }).catch(() => {}); } catch (e) {} }
initDL(); setTimeout(initDL, 1200);
async function saveFile(name, bytes) {
  const blob = new Blob([bytes], { type: name.endsWith('.pdf') ? 'application/pdf' : 'application/zip' });
  if (!DL) { initDL(); await new Promise(r => setTimeout(r, 300)); }
  if (DL) {
    try { await DL.save({ filename: name, data: blob }); return 'Scaricato: ' + name; }
    catch (e) { if (e && e.code === 'declined') return 'Download annullato.'; if (e && e.code === 'rate_limited') return 'Una richiesta di download è già aperta: confermala o riprova tra poco.'; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  return 'Scaricato: ' + name;
}
const tick = () => new Promise(r => setTimeout(r, 0));
function prog(v, msg) { $('progBar').style.width = Math.round(v * 100) + '%'; if (msg) $('status').textContent = msg; }
function baseName(p) { return `prismatica_${p.W}x${p.H}_${S.layout.cells.length}pz_${VERSION}`; }
async function exportZip() {
  const btns = [$('btnZip'), $('btnPdf')]; btns.forEach(b => b.disabled = true);
  try {
    clearTimeout(timer); if (pending !== 'view') run();
    const p = P(), enc = new TextEncoder(), files = [], base = baseName(p);
    for (let i = 0; i < S.plates.length; i++) {
      const pl = S.plates[i]; prog(i / (S.plates.length + 2), `Genero ${pl.name} (${i + 1} di ${S.plates.length})…`); await tick();
      const r = plateTris(pl, p, p.engrave);
      const cname = pl.kind === 'frame' ? 'Telaio' : dispLabel(S.palette[pl.color]);
      const fname = pl.name.replace(/[^\p{L}\p{N}-]+/gu, '_');
      files.push({ name: `${base}/3MF/${fname}.3mf`, data: await make3MF(r.objects, r.color, cname, pl.name), compress: false });
      files.push({ name: `${base}/STL/${fname}.stl`, data: stlBinary(r.objects) });
    }
    prog(0.9, 'Preparo dima e mappe…'); await tick();
    files.push({ name: `${base}/Dima_1a1_e_mappa_piatti.pdf`, data: await buildPDF(p), compress: false });
    const plateOf = new Map(); for (const pl of S.plates) if (pl.kind === 'pieces') for (const it of pl.items) plateOf.set(it.cell.id, pl.name);
    const csv = ['numero;colore;hex;riga_dall_alto;posizione_nella_riga;piatto;x_mm;y_mm;altezza_mm;punta_su'].concat(S.layout.cells.map(c => [c.id, dispLabel(S.palette[c.color]), dispHex(S.palette[c.color]), c.rowTop + 1, c.j + 1, plateOf.get(c.id), c.c[0].toFixed(1), c.c[1].toFixed(1), c.h.toFixed(1), c.up ? 'si' : 'no'].join(';')));
    files.push({ name: `${base}/assemblaggio.csv`, data: enc.encode('﻿' + csv.join('\n')) });
    files.push({ name: `${base}/LEGGIMI.txt`, data: enc.encode(readme(p)) });
    prog(0.96, 'Comprimo…'); await tick();
    const zip = await zipFiles(files);
    prog(1, await saveFile(base + '.zip', zip));
  } catch (e) { console.error(e); prog(0, 'Errore durante l\'esportazione: ' + e.message); }
  btns.forEach(b => b.disabled = false);
}
function readme(p) {
  const L = S.layout;
  return [`Prismatica ${VERSION} - wall art 3D a triangoli`, '', `Opera finita: ${p.W} x ${p.H} mm`, `Pezzi: ${L.cells.length} (lato ${p.s.toFixed(1)} mm, forma ${p.shape}, altezza ${p.hMin}-${p.hMax} mm)`, `Piano: ${p.bedW} x ${p.bedD} mm`, '',
    'COLORI', ...S.palette.map((c, i) => `  ${LETTER(i)}  ${dispLabel(c)}  ${dispHex(c).toUpperCase()}  ${S.counts[i]} pezzi` + (c.mixOn && c.mix ? `\r\n       MIX: carica nell'AMS ${c.mix.parts.map(x => x.f.name + ' (' + x.pct + '%)').join(' + ')}. In Bambu Studio 2.5.3+: Filamenti > Aggiungi filamento misto, rapporto ${c.mix.ratio}, assegnalo a tutti gli oggetti del piatto. Spurgo stimato ${mixCost(i, p).grams} g, +${mixCost(i, p).hours.toFixed(1)} h.` : '')), '',
    'FILE', '  3MF/  un file per piatto, ogni pezzo e un oggetto separato chiamato #numero (consigliato)', '  STL/  gli stessi piatti in STL binario', '  Dima_1a1_e_mappa_piatti.pdf  dima da stampare al 100% + mappa di ogni piatto', '  assemblaggio.csv  elenco pezzi con colore, piatto, posizione e altezza', '',
    S.palette.some(c => c.mixOn && c.mix) ? 'I piatti a colore singolo non richiedono AMS. I piatti "Mix" vanno stampati con AMS e filamento misto (vedi COLORI).' : 'OGNI PIATTO E DI UN SOLO COLORE: non serve AMS. Carica il filamento indicato nel nome del file.', '',
    'MONTAGGIO',
    `  1. Stampa la dima (${sheetPlan(p).nx * sheetPlan(p).ny} fogli ${p.paper}) al 100%, "dimensioni effettive". Controlla le barre da 50 mm. Taglia lungo la linea rossa TAGLIA e allinea le mezze croci al foglio vicino (fascia di ${SHEET.ov} mm). Segui la pagina Mappa dei fogli.`,
    p.frameOn ? `  2. Stampa i tasselli del telaio (spessore ${p.frameT} mm) e incollali sulla dima / su un pannello rigido seguendo le etichette.` : '  2. Incolla la dima su un pannello rigido.',
    '  3. Stampa i piatti dei pezzi. Il numero e inciso sotto ogni pezzo (si legge girandolo).',
    p.frameOn ? `  4. Inserisci ogni pezzo nella cella con lo stesso numero. Gioco incastro ${p.tol} mm: se e duro, aumentalo e rigenera.` : '  4. Incolla ogni pezzo sulla cella con lo stesso numero.',
    '', 'Consigli di stampa: altezza strato 0.2 mm, 2-3 perimetri, riempimento 10-15%, nessun supporto.'].join('\r\n');
}
$('btnZip').addEventListener('click', exportZip);
$('btnPdf').addEventListener('click', async () => { $('btnPdf').disabled = true; try { clearTimeout(timer); if (pending !== 'view') run(); const p = P(); prog(0.5, 'Preparo la dima…'); await tick(); prog(1, await saveFile(baseName(p) + '_dima.pdf', await buildPDF(p))); } catch (e) { prog(0, 'Errore: ' + e.message); } $('btnPdf').disabled = false; });

// avvio
S.src = demoImage();
resize();
run();
loadInventory();
window.__prismatica = { S, P, plateTris, buildPDF, make3MF, stlBinary, zipFiles };
</script>
